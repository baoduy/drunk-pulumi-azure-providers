name: build-publish

on:
  workflow_dispatch: {}
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

env:
  Enable_Release: 'true'

# Never publish two versions at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
      id-token: write # npm provenance
    steps:
      # Actions pinned to commit SHAs (supply-chain safety); comments show the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed to compute the next version

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org/'

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec eslint src

      - run: pnpm run test

      - run: pnpm run build

      - name: Compute next version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          next="${major#v}.${minor}.$((patch + 1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Publish to npm
        if: ${{ github.event_name != 'pull_request' && env.Enable_Release == 'true' }}
        working-directory: .out-bin
        run: |
          npm pkg set version=${{ steps.version.outputs.next }}
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After publishing, so a failed publish never leaves an orphan tag.
      - name: Create Release
        if: ${{ github.event_name != 'pull_request' && env.Enable_Release == 'true' }}
        run: gh release create "v${{ steps.version.outputs.next }}" --title "Release ${{ steps.version.outputs.next }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
